# Dev: PostgreSQL lokalnie — URL w `backend/.../appsettings.Development.json` → Host=localhost;Port=5432;…
services:
  postgres:
    image: postgres:alpine
    container_name: booking_saas_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: App_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: booking_saas_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: always

  # MinIO — S3-compatible storage do lokalnego dev (odpowiednik Cloudflare R2 na prodzie).
  # API na :9000, konsola web na :9001. Dev credentials minioadmin/minioadmin (mapują się na
  # Storage:AccessKey/SecretKey w appsettings.Development.json).
  minio:
    image: minio/minio
    container_name: booking_saas_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bootstrap bucketu: czeka aż MinIO wstanie, tworzy bucket `zapiszme-media` (idempotentnie)
  # i ustawia na nim anonimowy public-read (dev) — żeby publiczne URL-e obrazów działały bez
  # podpisywania, tak jak publiczny bucket R2 na prodzie. Kontener kończy się po wykonaniu.
  createbuckets:
    image: minio/mc
    container_name: booking_saas_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/zapiszme-media &&
      mc anonymous set download local/zapiszme-media;
      "
    restart: "no"

volumes:
  postgres_data:
  minio_data:
